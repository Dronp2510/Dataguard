services:
  - type: web
    name: dataguard-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        value: sqlite:////tmp/dataguard.db
      - key: STORAGE_PATH
        value: /tmp/secure_storage
      - key: CORS_ORIGINS
        value: https://dataguard-frontend.onrender.com
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "1610612736"
  - type: web
    name: dataguard-frontend
    runtime: static
    rootDir: app_frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dataguard-backend.onrender.com
      - key: VITE_PUBLIC_SHARE_ORIGIN
        value: https://dataguard-frontend.onrender.com
